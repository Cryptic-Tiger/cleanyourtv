# Build Android CleanYourTV for Sony BRAVIA 8.0. Never talks to the TV.
name: Sony Cinema APK
on:
  push:
    branches: [sony-bravia-cinema]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Sony Cinema branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run CleanYourTV Python tests
        run: |
          python3 -m venv tools/venv
          tools/venv/bin/pip install -q -r tools/requirements.txt
          python3 -m unittest discover -s tests -v
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK platform and build tools
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build and verify Android APK
        run: |
          cd launcher
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
          cd ..
          APK=launcher/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          size=$(stat -c %s "$APK")
          echo "APK size $size bytes"
          test "$size" -lt 589824
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -q "sdkVersion:'26'"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK"
      - name: Assemble iPhone kit and checksums
        run: |
          set -eu
          mkdir -p kit/sony-cinema dist
          cp launcher/app/build/outputs/apk/release/app-release.apk dist/SonyCinema.apk
          cp dist/SonyCinema.apk kit/sony-cinema/SonyCinema.apk
          cp sony/cyt.sh kit/sony-cinema/cyt.sh
          cp sony/SONY-CINEMA-README.md kit/sony-cinema/README.md
          cp themes/sony-cinema/config.json kit/sony-cinema/config.json
          # The user's original 95KB Cinema artwork, pinned to their own LG fork's known commit.
          curl --fail --location --retry 3 --max-time 90 \
            https://raw.githubusercontent.com/Cryptic-Tiger/cleanyourtv-webos/f005dd0/themes/cinema/cinema.jpg \
            -o kit/sony-cinema/wallpaper.jpg
          test "$(git hash-object kit/sony-cinema/wallpaper.jpg)" = "a0dac6a7a0749173579f63796742cbf454739856"
          (cd kit && zip -q -r ../dist/sony-cinema-kit.zip sony-cinema)
          (cd dist && sha256sum SonyCinema.apk > SonyCinema.apk.sha256 && sha256sum sony-cinema-kit.zip > sony-cinema-kit.zip.sha256)
      - name: Publish Sony Cinema prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          printf 'Sony Android TV 8.0 Cinema build from commit %s.\n\nRequires ADB and model verification. Install APK first, then follow the bundled README. This uses the upstream debug signing configuration, so future rebuilds may have a different signer.\n' "$GITHUB_SHA" > release-notes.txt
          gh release delete sony-cinema --yes --cleanup-tag 2>/dev/null || true
          gh release create sony-cinema --prerelease --target "$GITHUB_SHA" --title "Sony BRAVIA Cinema (Android TV 8)" --notes-file release-notes.txt dist/*
